# ============================================================================
# new-api Helm Chart — default values
# ============================================================================
# This chart deploys the new-api application only. Database and Redis are NOT
# bundled; provide them via `externalDatabase` and `redis`.
# ============================================================================

## @section new-api image
##
image:
  registry: docker.io
  repository: calciumion/new-api
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

## @section new-api runtime
##
app:
  # Number of replicas. Set >1 only when SESSION_SECRET is configured and a
  # shared database/Redis is used, because session state is otherwise local.
  replicaCount: 1

  # Container port (matches Dockerfile EXPOSE).
  containerPort: 3000

  # Extra command-line args forwarded to the binary (e.g. "--log-dir /app/logs").
  args: []

  # Timezone.
  timezone: Asia/Shanghai

  # Instance identity written to audit logs as NODE_NAME. Empty (default):
  # the StatefulSet pod name (new-api-0, new-api-1, ...) is injected via the
  # downward API — unique per replica and stable across restarts. Set a static
  # value only for single-replica or shared-identity setups.
  nodeIdentity: ""

  # Resource requests/limits. new-api is CPU-light but can spike under heavy
  # relay traffic; keep memory headroom for in-flight stream buffers.
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Health probes mirror the docker-compose healthcheck (/api/status).
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/status
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/status
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    enabled: false
    httpGet:
      path: /api/status
      port: http
    periodSeconds: 10
    failureThreshold: 30

  # Pod-level security context.
  podSecurityContext:
    runAsNonRoot: false
    fsGroup: 0
  containerSecurityContext:
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Update strategy (StatefulSet RollingUpdate; replicaCount > 1 is safe).
  # nodeSelector / tolerations for scheduling.
  nodeSelector: {}
  tolerations: []

## @section Database (external only)
##
database:
  # Connection pool tuning (forwarded as env vars to new-api).
  maxIdleConns: 100
  maxOpenConns: 1000
  maxLifetime: 60
  slowThresholdMs: 200

## @section External database (required)
## The chart does not bundle a database server. Provide a full DSN to an
## external PostgreSQL or MySQL instance, e.g. one deployed by the helm/infra
## chart.
##
externalDatabase:
  # Full DSN. Examples:
  #   PostgreSQL: postgresql://user:pass@host:5432/dbname
  #   MySQL:      user:pass@tcp(host:3306)/dbname?parseTime=true
  dsn: ""
  # Optional separate log DSN (e.g. a second database on the same server).
  logDsn: ""

## @section Redis (external only)
## The chart does not bundle Redis. Provide a full connection string when Redis
## is used as cache/distributed state.
##
redis:
  enabled: true
  connectionString: ""  # e.g. redis://:password@host:6379/0

## @section Persistence
## Volumes are provisioned per replica via StatefulSet volumeClaimTemplates
## (<name>-data-0, <name>-logs-1, ...) so each pod gets its own storage.
## /data always persists (SQLite when no DB configured, uploaded assets, runtime
## state). /app/logs persists only when enabled (needs `app.args: ["--log-dir",
## "/app/logs"]`); otherwise it is an emptyDir.
##
persistence:
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}
  logs:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}

## @section Service
##
service:
  type: ClusterIP
  port: 3000
  nodePort: ""
  annotations: {}

## @section Ingress
##
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: new-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: new-api-tls
  #    hosts:
  #      - new-api.local

## @section new-api environment variables
## Sensitive values go to Secret (see `extraSecretEnv`); non-sensitive to ConfigMap.
##
extraEnv: {}
  # ERROR_LOG_ENABLED: "true"
  # BATCH_UPDATE_ENABLED: "true"
  # STREAMING_TIMEOUT: "300"
  # RELAY_IDLE_CONN_TIMEOUT: "90"
  # SYNC_FREQUENCY: "60"
  # MEMORY_CACHE_ENABLED: "true"
  # GENERATE_DEFAULT_TOKEN: "false"

# Sensitive env vars rendered into a Secret.
extraSecretEnv: {}
  # SESSION_SECRET: "random-string-for-multi-node"
  # SESSION_COOKIE_SECURE: "true"
  # SESSION_COOKIE_TRUSTED_URL: "https://example.com"
  # TRUSTED_PROXIES: "10.0.0.0/8"
  # GOOGLE_ANALYTICS_ID: "G-XXXXXXXXXX"
