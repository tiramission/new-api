# ============================================================================
# new-api Helm Chart — default values
# ============================================================================
# This chart deploys the new-api application only. Database and Redis are NOT
# bundled; they must be provided externally via `externalDatabase` and
# `redis.external` (deploy them separately, e.g. with the helm/infra chart).
# ============================================================================

## @section Global
##
global:
  # Optional image registry override applied to all images.
  imageRegistry: ""
  # Optional pull secrets applied to all images.
  imagePullSecrets: []
  # Optional storage class override applied to all PVCs.
  storageClass: ""

## @section new-api image
##
image:
  registry: docker.io
  repository: calciumion/new-api
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

## @section new-api runtime
##
app:
  # Number of replicas. Set >1 only when SESSION_SECRET is configured and a
  # shared database/Redis is used, because session state is otherwise local.
  replicaCount: 1

  # Container port (matches Dockerfile EXPOSE).
  containerPort: 3000

  # Extra command-line args forwarded to the binary (e.g. "--log-dir /app/logs").
  args: []

  # Timezone.
  timezone: Asia/Shanghai

  # Node identity used in audit logs; recommend overriding per replica when
  # running multiple instances.
  nodeName: new-api-node-1

  # Resource requests/limits. new-api is CPU-light but can spike under heavy
  # relay traffic; keep memory headroom for in-flight stream buffers.
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Health probes mirror the docker-compose healthcheck (/api/status).
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/status
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/status
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    enabled: false
    httpGet:
      path: /api/status
      port: http
    periodSeconds: 10
    failureThreshold: 30

  # Pod-level security context.
  podSecurityContext:
    runAsNonRoot: false
    fsGroup: 0
  containerSecurityContext:
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Update strategy.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # Pod anti-affinity to spread replicas across nodes when replicaCount > 1.
  podAntiAffinityPreset: ""  # "", "soft", "hard"

  # Optional nodeSelector / tolerations / affinity (override above presets).
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Optional extra pod labels / annotations.
  podLabels: {}
  podAnnotations: {}

## @section Database (external only)
##
database:
  # Connection pool tuning (forwarded as env vars to new-api).
  maxIdleConns: 100
  maxOpenConns: 1000
  maxLifetime: 60
  slowThresholdMs: 200

## @section External database (required)
## The chart does not bundle a database server. Provide a full DSN to an
## external PostgreSQL or MySQL instance, e.g. one deployed by the helm/infra
## chart.
##
externalDatabase:
  enabled: true
  # Full DSN. Examples:
  #   PostgreSQL: postgresql://user:pass@host:5432/dbname
  #   MySQL:      user:pass@tcp(host:3306)/dbname?parseTime=true
  dsn: ""
  # Optional separate log DSN (e.g. a second database on the same server).
  logDsn: ""

## @section Redis (external only)
## The chart does not bundle Redis. Provide a full connection string when Redis
## is used as cache/distributed state.
##
redis:
  external:
    enabled: true
    connectionString: ""  # e.g. redis://:password@host:6379/0

## @section Persistence for new-api container (/data, /app/logs)
##
persistence:
  # /data — SQLite (when no DB configured), uploaded assets, runtime state.
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}
  # /app/logs — structured log files. Required when args include --log-dir /app/logs.
  logs:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}

## @section Service
##
service:
  type: ClusterIP
  port: 3000
  nodePort: ""
  annotations: {}
  clusterIP: ""
  externalIPs: []
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

## @section Ingress
##
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: new-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: new-api-tls
  #    hosts:
  #      - new-api.local

## @section HorizontalPodAutoscaler
##
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

## @section PodDisruptionBudget
##
pdb:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

## @section Service account
##
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

## @section new-api environment variables
## Sensitive values go to Secret (see `extraSecretEnv`); non-sensitive to ConfigMap.
##
extraEnv: {}
  # ERROR_LOG_ENABLED: "true"
  # BATCH_UPDATE_ENABLED: "true"
  # STREAMING_TIMEOUT: "300"
  # RELAY_IDLE_CONN_TIMEOUT: "90"
  # SYNC_FREQUENCY: "60"
  # MEMORY_CACHE_ENABLED: "true"
  # GENERATE_DEFAULT_TOKEN: "false"

# Sensitive env vars rendered into a Secret.
extraSecretEnv: {}
  # SESSION_SECRET: "random-string-for-multi-node"
  # SESSION_COOKIE_SECURE: "true"
  # SESSION_COOKIE_TRUSTED_URL: "https://example.com"
  # TRUSTED_PROXIES: "10.0.0.0/8"
  # GOOGLE_ANALYTICS_ID: "G-XXXXXXXXXX"

## @section NetworkPolicy
##
networkPolicy:
  enabled: false
  # When enabled, allow egress to anywhere by default. Tighten in production.
  allowExternalEgress: true

## @section Extra manifests
## Render arbitrary extra objects (e.g. ExternalSecrets, PrometheusRule).
extraObjects: []
