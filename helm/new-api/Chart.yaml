apiVersion: v2
name: new-api
description: new-api is an AI API gateway/proxy that aggregates 40+ upstream AI providers behind a unified OpenAI-compatible API, with user management, billing, rate limiting, and an admin dashboard.
type: application
version: 1.0.0
# appVersion follows the upstream new-api release. Update together with image.tag.
appVersion: latest
home: https://github.com/QuantumNous/new-api
sources:
  - https://github.com/QuantumNous/new-api
maintainers:
  - name: QuantumNous
keywords:
  - ai
  - gateway
  - proxy
  - openai
  - llm
  - new-api
icon: https://raw.githubusercontent.com/QuantumNous/new-api/main/web/public/logo.png
dependencies:
  - name: postgresql
    version: 16.7.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mysql
    version: 12.3.x
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enabled
  - name: redis
    version: 21.2.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
