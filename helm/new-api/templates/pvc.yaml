{{- if .Values.persistence.data.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "new-api.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "new-api.labels" . | nindent 4 }}
  {{- with .Values.persistence.data.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  {{- $dataStorageClass := include "new-api.storageClass" (dict "global" .Values.global "local" .Values.persistence.data) }}
  {{- if $dataStorageClass }}
  storageClassName: {{ $dataStorageClass }}
  {{- end }}
{{- end }}
{{- if .Values.persistence.logs.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "new-api.fullname" . }}-logs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "new-api.labels" . | nindent 4 }}
  {{- with .Values.persistence.logs.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.logs.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.logs.size }}
  {{- $logsStorageClass := include "new-api.storageClass" (dict "global" .Values.global "local" .Values.persistence.logs) }}
  {{- if $logsStorageClass }}
  storageClassName: {{ $logsStorageClass }}
  {{- end }}
{{- end }}
