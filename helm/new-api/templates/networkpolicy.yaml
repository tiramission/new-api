{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "new-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "new-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "new-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from anywhere by default; tighten in production.
    - {}
  egress:
    {{- if .Values.networkPolicy.allowExternalEgress }}
    # Allow egress to anywhere (DNS, upstream AI providers, external DB/Redis).
    - {}
    {{- else }}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
{{- end -}}
