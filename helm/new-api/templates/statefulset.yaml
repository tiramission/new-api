apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "new-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "new-api.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "new-api.fullname" . }}
  replicas: {{ .Values.app.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "new-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "new-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Force rollout when config/secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "new-api.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.app.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: new-api
          image: {{ include "new-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.app.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "new-api.fullname" . }}-config
            - secretRef:
                name: {{ include "new-api.fullname" . }}-secret
          env:
            - name: NODE_NAME
              {{- if .Values.app.nodeIdentity }}
              value: {{ .Values.app.nodeIdentity | quote }}
              {{- else }}
              # Stable per-replica identity: StatefulSet pod names (new-api-0,
              # new-api-1, ...) are unique and survive restarts. Only set
              # `app.nodeIdentity` for single-replica or shared-identity setups.
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
              {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.containerPort }}
              protocol: TCP
          {{- if .Values.app.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.app.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.app.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.app.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.app.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.app.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /app/logs
      volumes:
        {{- if not .Values.persistence.data.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if not .Values.persistence.logs.enabled }}
        - name: logs
          emptyDir: {}
        {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if or .Values.persistence.data.enabled .Values.persistence.logs.enabled }}
  volumeClaimTemplates:
    {{- if .Values.persistence.data.enabled }}
    - metadata:
        name: data
        {{- with .Values.persistence.data.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.data.accessMode }}
        {{- with .Values.persistence.data.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.data.size }}
    {{- end }}
    {{- if .Values.persistence.logs.enabled }}
    - metadata:
        name: logs
        {{- with .Values.persistence.logs.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.logs.accessMode }}
        {{- with .Values.persistence.logs.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.logs.size }}
    {{- end }}
  {{- end }}
