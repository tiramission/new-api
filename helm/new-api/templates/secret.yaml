apiVersion: v1
kind: Secret
metadata:
  name: {{ include "new-api.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "new-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  SQL_DSN: {{ required "externalDatabase.dsn is required" .Values.externalDatabase.dsn | quote }}
  {{- if .Values.externalDatabase.logDsn }}
  LOG_SQL_DSN: {{ .Values.externalDatabase.logDsn | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_CONN_STRING: {{ .Values.redis.connectionString | quote }}
  {{- end }}
  {{- range $k, $v := .Values.extraSecretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
