{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: infra-redis-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: infra-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: infra-redis
spec:
  type: ClusterIP
  selector:
    app: infra-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: infra-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: infra-redis
spec:
  serviceName: infra-redis
  replicas: 1
  selector:
    matchLabels:
      app: infra-redis
  template:
    metadata:
      labels:
        app: infra-redis
    spec:
      containers:
        - name: redis
          image: {{ include "infra.redisImage" . }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              exec redis-server \
                --requirepass "$${REDIS_PASSWORD}" \
                --appendonly yes \
                --appendfilename "appendonly.aof" \
                --save ""
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-redis-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: infra-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infra-redis-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.redis.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.size }}
{{- end }}
